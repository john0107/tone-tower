  <body class="page-world">
    <a class="skip-link" href="#app">Skip to the adventure</a>
    <header class="site-top site-header">
      <a class="brand" href="./" aria-label="Tone Tower home"
        ><svg viewBox="0 0 20 23" aria-hidden="true">
          <path d="M9 7V3H5V0h5v3h5V0h4v4h-6v4" fill="#80b79a" />
          <path d="M4 8h12v3h3v9h-3v3H4v-3H1v-9h3Z" fill="#edbd76" />

      >
      <nav aria-label="Main navigation">
        <a id="home" class="nav-link" href="./" data-nav-page="home" aria-current="page"
          >World map</a
        ><a id="learn" class="nav-link" href="guide/" data-nav-page="sounds">Jyutping guide</a
        ><a id="about" class="nav-link" href="about/" data-nav-page="about">About</a
        ><button
          id="pause-game"
          class="icon-button"
          type="button"
          aria-label="Pause adventure"
          hidden
        >
          Ⅱ
        </button>
      </nav>
    </header>
    <main id="app" tabindex="-1">
      <div class="loading-state">
        <span class="loading-sprout" aria-hidden="true">✦</span>
        <h1>Train your ear for Cantonese.</h1>
        <p>Play Tone Tower and Skyrail to practise Cantonese tones and Jyutping spelling.</p>
        <p>Loading your adventure…</p>
        <noscript><p>Enable JavaScript to play and listen to recordings.</p></noscript>
      </div>
    </main>
    <footer class="site-footer">
      <div>
        <button id="progress" class="text-button" type="button">Records</button
        ><button id="credits" class="text-button" type="button">Voices & credits</button>
      </div>
      <div class="project-links" aria-label="Project links">
        <a class="text-button" href="about/" data-nav-page="about">About &amp; feedback</a>
        <a
          class="text-button"
          href="https://github.com/john0107/tone-tower"
          target="_blank"
          rel="noopener"
          >GitHub ↗</a
        >
      </div>
    </footer>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <button
        id="close-dialog"
        class="dialog-close icon-button"
        type="button"
        aria-label="Close dialog"
      >
        ×
      </button>
      <div id="dialog-body"></div>
    </dialog>
